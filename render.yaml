databases:
  - name: blockproxy-db
    databaseName: blockproxy
    user: blockproxy_user
    plan: free
    region: oregon

services:
  # ----------------------------------------------------
  # 1. Backend Web Service (Node.js Express API)
  # ----------------------------------------------------
  - type: web
    name: blockproxy-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npm run render:build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: blockproxy-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        fromService:
          type: web
          name: blockproxy-ui
          property: host

  # ----------------------------------------------------
  # 2. Frontend Web Service (React + Vite SPA Static Site)
  # ----------------------------------------------------
  - type: web
    name: blockproxy-ui
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: blockproxy-api
          property: host
